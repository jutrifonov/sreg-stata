name: Reference and native tests
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      native:
        description: Run full suite on a licensed self-hosted Stata runner
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  r-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.1'
          use-public-rspm: true
      - name: Install R test dependencies
        shell: Rscript {0}
        run: |
          install.packages(c("dplyr", "tidyr", "purrr", "extraDistr", "rlang", "cli",
                            "ggplot2", "viridis", "testthat", "haven", "knitr", "rmarkdown"))
      - name: Verify unchanged R reference (not native Stata verification)
        run: python3 tools/test.py --r-only
  native-stata:
    if: github.event_name == 'workflow_dispatch' && inputs.native
    runs-on: [self-hosted, stata]
    steps:
      - uses: actions/checkout@v4
      - name: Full R and native Stata suite
        run: python3 tools/test.py
